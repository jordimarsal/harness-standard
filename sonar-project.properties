# SonarQube scanner defaults — picked up automatically by
# ~/homelab/sonarqube/analyze.sh when the scanner runs from the repo root.
sonar.projectKey=jordimarsal:harness-standard
sonar.sourceEncoding=UTF-8

# evals-fixtures/** are frozen eval corpora: their test_cart.py files are
# intentionally minimal (S5914 constant booleans are the fixture's point).
# This list replaces the scanner's default exclusions entirely, so the
# standard build-output patterns are kept here too.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/target/**,**/.git/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/vendor/**,**/coverage/**,evals-fixtures/**
